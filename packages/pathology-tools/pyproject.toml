[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pathology-vision-tools"
version = "0.1.0"
requires-python = ">=3.10"
description = "Common H&E nucleus tools and visual inspection packets"
dependencies = ["numpy>=1.24", "scipy>=1.11", "scikit-image>=0.24", "Pillow>=10.4"]

[project.optional-dependencies]
openslide = ["openslide-python>=1.3", "openslide-bin>=4.0"]
