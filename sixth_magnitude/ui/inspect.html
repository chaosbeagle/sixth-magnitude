<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sixth Magnitude · Inspect</title>
<link rel="stylesheet" href="/vendor/annotorious.css"><link rel="stylesheet" href="/inspect.css"></head>
<body><header><div class="brand"><span class="star">✧</span><strong>Sixth Magnitude</strong></div><div id="run-label"></div><button id="export">Export results</button></header>
<div class="layout"><aside class="queue"><div class="eyebrow">Images</div><div id="sources"></div><div class="eyebrow">Regions</div><div id="regions"></div><details class="identity"><summary>Operator</summary><label>Operator ID<input id="actor" value="ai-operator" autocomplete="off"></label><label>Role<select id="role"><option value="ai">AI annotator</option><option value="reviewer">Human reviewer</option><option value="engineering">Demo / test</option></select></label><p id="model"></p></details></aside>
<main><div class="toolbar"><button id="new">New region</button><button id="rectangle">Rectangle</button><button id="polygon">Polygon</button><button id="home">Whole image</button><span id="source-scale"></span></div><div id="viewer" aria-label="Source image with editable regions"></div><div class="evidence"><figure><figcaption>Focus <span id="focus-info"></span></figcaption><a id="focus-link" target="_blank" rel="noopener"><img id="focus" alt="Selected region and saved outline"></a></figure><figure><figcaption>Context</figcaption><a id="context-link" target="_blank" rel="noopener"><img id="context" alt="Surrounding view; observations exclude the focus region"></a></figure></div></main>
<aside class="inspector"><div class="section-heading">Observation</div><label>Region label<input id="label" placeholder="Name the visible finding"></label><div id="scope-fields"></div><details><summary>Structured input</summary><textarea id="json" rows="8" spellcheck="false" aria-label="Partial observation JSON" placeholder='{"label":"...","focus":{"assessment_state":"assessed","findings":["..."]}}'></textarea><button id="apply-json">Apply JSON</button></details><details><summary>Geometry</summary><label>Bounds · pixels<input id="bounds" aria-label="Region bounds x0 y0 x1 y1"></label><label id="context-label">Context side<input id="context-size" type="number" min="1"></label><button id="apply-geometry">Apply geometry</button></details><div class="actions"><button id="save" class="primary">Save observation</button><button id="confirm">Confirm saved overlay</button><div id="revision"></div><button id="retry" hidden>Retry pending save</button><button id="reload">Reload saved state</button></div><details><summary>Human review</summary><select id="decision" aria-label="Review decision"><option value="accept">Accept</option><option value="reject">Reject</option><option value="defer">Defer</option></select><button id="review">Save review decision</button><div class="timers"><button id="timer-start">Start timer</button><button id="timer-stop">Pause timer</button></div></details><button id="delete" class="quiet">Remove region</button></aside></div>
<footer id="status" role="status" aria-live="polite">Loading…</footer>
<script src="/vendor/openseadragon.min.js"></script><script src="/vendor/annotorious.js"></script><script src="/inspect.js"></script></body></html>
