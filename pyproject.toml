[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sixth-magnitude"
version = "0.4.0"
description = "Evidence-linked visual inspection with a reusable agent workflow and a pathology workbench"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE.md", "THIRD_PARTY_NOTICES.md", "third_party/*.txt"]
dependencies = ["numpy>=1.24", "scipy>=1.11", "Pillow>=10.4", "jsonschema>=4.20", "pyarrow>=14"]

[project.optional-dependencies]
test = ["pytest>=8"]
openslide = ["openslide-python>=1.3", "openslide-bin>=4.0"]

[project.scripts]
sixth-magnitude = "sixth_magnitude.cli:main"

[tool.setuptools.packages.find]
include = ["sixth_magnitude*"]

[tool.setuptools.package-data]
sixth_magnitude = ["profiles/*.json", "ui/*.html", "ui/*.css", "ui/*.js", "ui/vendor/*", "skill/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
